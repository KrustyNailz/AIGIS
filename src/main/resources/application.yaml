server:
  port: 8097

# AIGIS settings are read from environment variables by AigisApplication:
#   AIGIS_PORT       — override the listen port (default 8097, or --port <n>)
#   AIGIS_API_KEY    — API key for write endpoints. Unset = dev mode (no auth).
#   AIGIS_DATA_DIR   — registry journal directory (default ./data; "none" = in memory only)
#   AIGIS_MAX_AGENTS_PER_OWNER — registrations allowed per owner (default 10000)
#   AIGIS_MAX_TOTAL_AGENTS / _PROMPTERS / _RECORDS — registry-wide limits (defaults 500000 / 100000 / 500000)
#   AUDIT_CHAIN_URL  — external audit chain base URL; events are POSTed to {url}/record.
#
# Do not use ${VAR:default} placeholders here: Helidon SE 4.1.6 does not resolve
# them and passes the literal text through (which would silently become the API key).
